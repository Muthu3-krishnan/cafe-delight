spring.application.name=cafe-hotel-demo

server.port=${PORT:8080}

# --- Database ---
# By DEFAULT this runs on an in-memory H2 database so you can test locally
# with zero setup (just run the app, no Postgres install needed).
#
# For production (Render), set these environment variables and it will
# automatically switch to Postgres - no code changes required:
#   SPRING_DATASOURCE_URL       e.g. jdbc:postgresql://<host>:5432/<db>
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_DATASOURCE_DRIVER    org.postgresql.Driver
#   SPRING_JPA_DATABASE_PLATFORM org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:cafedb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 console - only meaningful when actually running on H2. Safe to leave on;
# disable in prod by setting H2_CONSOLE_ENABLED=false if you want.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# --- Email (SMTP) ---
# Fill these in with real credentials (as env vars in production) to send
# order-confirmation / status-update emails.
# For Gmail: enable 2FA on the account and generate an "App Password" -
# use that as spring.mail.password (your normal Gmail password will NOT work).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- JWT ---
# IMPORTANT: override app.jwt.secret via the JWT_SECRET env var in production.
app.jwt.secret=${JWT_SECRET:demoCafeHotelSuperSecretKeyForJwtSigningChangeMe123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Comma-separated list of allowed frontend origins.
# Local dev default below. In production set CORS_ALLOWED_ORIGINS to your
# Netlify URL, e.g. https://your-cafe-app.netlify.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
